name: contract

on:
  pull_request:
    paths: ["Synq/Synq.yaml"]
  push:
    branches: [main]
    paths: ["Synq/Synq.yaml"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@latest lint Synq/Synq.yaml --format=github-actions
