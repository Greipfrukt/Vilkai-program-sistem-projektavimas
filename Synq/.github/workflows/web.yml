name: web

on:
  pull_request:
    paths: ["Synq/web/**", "Synq/Synq.yaml"]
  push:
    branches: [main]
    paths: ["Synq/web/**"]

defaults:
  run:
    working-directory: Synq/web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Synq/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
